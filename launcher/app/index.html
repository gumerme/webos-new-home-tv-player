<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS TV</title>
    <script src="webOSTV.js"></script>
    <script src="defaults.js"></script>
    <script>
        // Seed missing settings from defaults.js (if present) before the app reads them, then
        // apply its one-time forced values (FMTV_FORCED) once per FMTV_FORCED_REV, and add
        // each FMTV_ADD_FAVORITES app to the shelf once (right after `after`), keeping the
        // order the viewer set.
        (function() {
            var d = window.FMTV_DEFAULTS;
            var forced = window.FMTV_FORCED;
            var adds = window.FMTV_ADD_FAVORITES || [];
            try {
                for (var k in d) {
                    if (Object.prototype.hasOwnProperty.call(d, k) && localStorage.getItem(k) === null) {
                        localStorage.setItem(k, d[k]);
                    }
                }
                if (forced && localStorage.getItem('fmtv_forced_rev') !== window.FMTV_FORCED_REV) {
                    for (var f in forced) {
                        if (Object.prototype.hasOwnProperty.call(forced, f)) localStorage.setItem(f, forced[f]);
                    }
                    localStorage.setItem('fmtv_forced_rev', window.FMTV_FORCED_REV);
                }
                adds.forEach(function(a) {
                    var key = 'fmtv_fav_added_' + a.id;
                    if (localStorage.getItem(key)) return;
                    var favs = JSON.parse(localStorage.getItem('fmtv_favorites') || 'null');
                    if (favs && favs.indexOf(a.id) === -1) {
                        var at = favs.indexOf(a.after);
                        favs.splice(at === -1 ? favs.length : at + 1, 0, a.id);
                        localStorage.setItem('fmtv_favorites', JSON.stringify(favs));
                    }
                    localStorage.setItem(key, '1');
                });
            } catch (e) {}
        })();

        // Flex `gap` arrived in Chromium 84; webOS 4.x and older ship earlier engines, where
        // the no-flex-gap class swaps it for margins (see the fallback block in the CSS).
        (function() {
            var probe = document.createElement('div');
            probe.style.display = 'flex';
            probe.style.flexDirection = 'column';
            probe.style.rowGap = '1px';
            probe.appendChild(document.createElement('div'));
            probe.appendChild(document.createElement('div'));
            document.documentElement.appendChild(probe);
            var hasFlexGap = probe.scrollHeight === 1;
            document.documentElement.removeChild(probe);
            if (!hasFlexGap) document.documentElement.className += ' no-flex-gap';
        })();
    </script>
    <style>
        /* Home "Ambiente" (2.0): hour-of-day wallpaper (gradients, no image, no blur), big clock,
           a round app dock and, below it, ONE content row at a time from the homeserver.
           Must run on Chromium 53 (webOS 4.x, TV 2): no flex/grid gap (margins instead), no
           inset, no aspect-ratio, no place-items; only transform and opacity animate. */
        @font-face { font-family: "Outfit"; font-style: normal; font-weight: 200; src: url("assets/fonts/outfit-latin-200-normal.woff2") format("woff2"); }
        @font-face { font-family: "Outfit"; font-style: normal; font-weight: 300; src: url("assets/fonts/outfit-latin-300-normal.woff2") format("woff2"); }
        @font-face { font-family: "Outfit"; font-style: normal; font-weight: 400; src: url("assets/fonts/outfit-latin-400-normal.woff2") format("woff2"); }
        @font-face { font-family: "Outfit"; font-style: normal; font-weight: 500; src: url("assets/fonts/outfit-latin-500-normal.woff2") format("woff2"); }

        :root {
            /* 09/11: azul de antes (o mesmo do Player até a 2.0.5); o nome --amber ficou só por ser usado em todo o CSS */
            --bg: #0a0e1a;
            --panel: #121a2e;
            --panel-2: #1c2438;
            --amber: #0a84ff;
            --amber-soft: rgba(10, 132, 255, 0.18);
            --live: #e5534b;
            --text-primary: #f5f5f7;
            --text-secondary: rgba(245, 245, 247, 0.66);
            --accent: #0a84ff;
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-focus-border: rgba(255, 255, 255, 0.95);
            --f-ui: "Outfit", "Museo Sans", "LG Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background: var(--bg);
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            font-family: var(--f-ui);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        button, input, select { font-family: var(--f-ui); }

        .oculto { display: none !important; }

        /* ---------- the TV screen: a fixed 1920x1080 canvas (both TVs report a 1920 viewport) ---------- */
        #tv {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            color: #fff;
        }

        #tv .papel, #tv .sombra, #tv .escuro {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
        }

        /* Wallpaper: one gradient per part of the day, swapped by class (no crossfade). */
        #tv .papel { background: #0a0e1a; }
        #tv .papel.manha { background: radial-gradient(900px 600px at 78% 22%, rgba(255, 220, 170, 0.55), rgba(255, 220, 170, 0) 70%), linear-gradient(165deg, #3b4a57 0%, #73828b 46%, #c7a982 100%); }
        #tv .papel.tarde { background: radial-gradient(1000px 640px at 70% 12%, rgba(255, 236, 200, 0.45), rgba(255, 236, 200, 0) 70%), linear-gradient(170deg, #2c3a44 0%, #5d6f78 50%, #b79a72 100%); }
        #tv .papel.fim { background: radial-gradient(900px 520px at 74% 68%, rgba(255, 170, 90, 0.6), rgba(255, 170, 90, 0) 70%), linear-gradient(175deg, #241c2a 0%, #5a3a3e 48%, #c97f45 100%); }
        #tv .papel.noite { background: radial-gradient(900px 560px at 78% 18%, rgba(70, 120, 255, 0.22), rgba(70, 120, 255, 0) 70%), linear-gradient(175deg, #05070d 0%, #0a0e1a 50%, #171d33 100%); }
        #tv .sombra { background: linear-gradient(90deg, rgba(4, 6, 12, 0.55) 0%, rgba(4, 6, 12, 0.15) 55%, rgba(4, 6, 12, 0) 100%), linear-gradient(0deg, rgba(4, 6, 12, 0.72) 0%, rgba(4, 6, 12, 0) 55%); }
        #tv .escuro { background: rgba(6, 9, 20, 0.62); opacity: 0; transition: opacity 0.4s ease; }
        #tv.conteudo .escuro { opacity: 1; }

        /* Clock, date line and the next reminder */
        #tv .relogio {
            position: absolute;
            left: 132px;
            top: 168px;
            transform-origin: 0 0;
            transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        #tv.conteudo .relogio { transform: translate(-36px, -104px) scale(0.36); }
        #tv .hora {
            font-weight: 200;
            font-size: 236px;
            line-height: 0.9;
            letter-spacing: -0.04em;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        #tv .linha {
            margin-top: 26px;
            display: flex;
            align-items: center;
            font-weight: 300;
            font-size: 34px;
            color: rgba(255, 255, 255, 0.88);
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }
        #tv .linha > * + * { margin-left: 22px; }
        #tv .linha svg { width: 38px; height: 38px; flex: none; }
        #tv .aviso {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            font-weight: 400;
            font-size: 28px;
            color: #fff;
            padding: 10px 22px 10px 16px;
            border-radius: 30px;
            background: rgba(10, 132, 255, 0.2);
            border: 1px solid rgba(10, 132, 255, 0.55);
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }
        #tv .aviso svg { width: 28px; height: 28px; color: var(--amber); margin-right: 14px; flex: none; }
        #tv.conteudo .linha, #tv.conteudo .aviso { opacity: 0; }
        /* Apps being installed/updated (any app, in the dock or not): spinner + name + percent. */
        #tv .instalando {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: opacity 0.3s ease;
        }
        #tv .instalando .it {
            display: inline-flex;
            align-items: center;
            font-weight: 400;
            font-size: 28px;
            color: #fff;
            padding: 10px 22px 10px 14px;
            border-radius: 30px;
            background: rgba(10, 132, 255, 0.2);
            border: 1px solid rgba(10, 132, 255, 0.55);
            white-space: nowrap;
            margin-bottom: 10px;
        }
        #tv .instalando .gira {
            width: 26px; height: 26px; margin-right: 14px; flex: none;
            border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.25); border-top-color: var(--amber);
            -webkit-animation: girar 0.9s linear infinite; animation: girar 0.9s linear infinite;
        }
        #tv .instalando .pb { width: 120px; height: 6px; margin-left: 18px; border-radius: 3px; background: rgba(255, 255, 255, 0.22); overflow: hidden; }
        #tv .instalando .pb i { display: block; height: 100%; background: var(--amber); }
        #tv.conteudo .instalando { opacity: 0; }
        @-webkit-keyframes girar { to { -webkit-transform: rotate(360deg); } }
        #tv .canto {
            position: absolute;
            right: 96px;
            top: 64px;
            display: flex;
            align-items: center;
            font-weight: 300;
            font-size: 28px;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #tv .canto svg { width: 30px; height: 30px; margin-right: 16px; flex: none; }
        #tv.conteudo .canto { opacity: 1; }

        /* Weather, big, on the right (resting only; the small corner summary takes over below). */
        #tv .clima {
            position: absolute;
            right: 132px;
            top: 150px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }
        #tv.conteudo .clima { opacity: 0; }
        #tv .clima .agora { display: flex; align-items: center; }
        #tv .clima .agora svg { width: 168px; height: 168px; margin-right: 30px; flex: none; }
        #tv .clima .temp { font-weight: 200; font-size: 150px; line-height: 0.9; letter-spacing: -0.04em; }
        #tv .clima .ceu { margin-top: 18px; font-weight: 300; font-size: 34px; color: rgba(255, 255, 255, 0.9); }
        #tv .clima .cid { margin-top: 4px; font-weight: 300; font-size: 26px; color: rgba(255, 255, 255, 0.6); }

        /* Text size setting: the date/weather line, the reminder and the corner weather. */
        :root.ts-large #tv .linha, :root.ts-large #tv .aviso, :root.ts-large #tv .canto { zoom: 1.2; }
        :root.ts-xlarge #tv .linha, :root.ts-xlarge #tv .aviso, :root.ts-xlarge #tv .canto { zoom: 1.4; }

        /* App dock: round icons, name only on the focused one */
        #tv .doca {
            position: absolute;
            left: 132px;
            right: 0;
            top: 640px;
            height: 200px;
            transform-origin: 0 0;
            transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.3s ease;
        }
        #tv.conteudo .doca { transform: translateY(-410px) scale(0.72); opacity: 0.55; }
        #tv .doca-trilho {
            position: relative;
            display: flex;
            align-items: flex-start;
            transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        #tv .doca-app {
            position: relative;
            flex: none;
            width: 132px;
            height: 132px;
            margin-right: 34px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.16s ease;
        }
        #tv .doca-ico {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1c2438;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }
        #tv .doca-ico img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
        #tv .doca-ico img.tile-brand-logo { left: 24%; top: 24%; width: 52%; height: 52%; object-fit: contain; }
        #tv .doca-ico svg { width: 52px; height: 52px; }
        #tv .doca-ico .app-art-fallback { font-size: 20px; font-weight: 500; padding: 14px; }
        #tv .doca-app.vidro .doca-ico { background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.28); box-shadow: none; }
        #tv .doca-app .nome {
            position: absolute;
            top: 152px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-weight: 400;
            font-size: 24px;
            color: #fff;
            opacity: 0;
        }
        #tv .doca-app .on {
            position: absolute;
            bottom: -16px;
            left: 50%;
            width: 8px;
            height: 8px;
            margin-left: -4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
        }
        #tv .doca-app .anel {
            position: absolute;
            top: -6px; right: -6px; bottom: -6px; left: -6px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: var(--amber);
            animation: girar 1.2s linear infinite;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
        #tv .doca-app.foco { transform: scale(1.14); }
        #tv .doca-app.foco .doca-ico { box-shadow: 0 0 0 5px #fff, 0 16px 34px rgba(0, 0, 0, 0.45); }
        #tv .doca-app.foco .nome { opacity: 1; }
        #tv .doca-app.movendo { transform: translateY(-14px) scale(1.14); }
        #tv .doca-app.movendo .doca-ico { box-shadow: 0 0 0 5px var(--amber), 0 16px 34px rgba(0, 0, 0, 0.45); }
        #tv .doca-app[aria-busy="true"] .doca-ico { box-shadow: 0 0 0 5px var(--amber); }

        /* "Go down for ..." hint (and the reorder instructions) */
        #tv .descer {
            position: absolute;
            left: 132px;
            bottom: 70px;
            display: flex;
            align-items: center;
            font-weight: 300;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.78);
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }
        #tv .descer b { font-weight: 500; color: #fff; }
        #tv .descer i {
            flex: none;
            width: 44px;
            height: 44px;
            margin-right: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #tv .descer i svg { width: 18px; height: 18px; }
        #tv.conteudo .descer { opacity: 0; }

        /* Content: one row at a time */
        #tv .prat {
            position: absolute;
            left: 0;
            right: 0;
            top: 400px;
            opacity: 0;
            transform: translateY(60px);
            transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        #tv.conteudo .prat { opacity: 1; transform: none; }
        #tv .secoes {
            margin-left: 132px;
            display: flex;
            font-weight: 400;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
        }
        #tv .secoes span { margin-right: 30px; cursor: pointer; }
        #tv .secoes span.on { color: #fff; font-weight: 500; }
        #tv .secoes span.on:after { content: ""; display: block; height: 3px; margin-top: 8px; border-radius: 2px; background: var(--amber); }
        #tv .info { margin: 30px 0 0 132px; height: 236px; }
        #tv .info .s {
            margin-top: 14px;
            max-width: 1180px;
            font-weight: 300;
            font-size: 24px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.78);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        #tv .info .t {
            font-weight: 500;
            font-size: 56px;
            line-height: 1.05;
            letter-spacing: -0.02em;
            max-width: 1300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #tv .info .m {
            margin-top: 10px;
            display: flex;
            align-items: center;
            font-weight: 300;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.82);
            white-space: nowrap;
        }
        #tv .info .m > * + * { margin-left: 18px; }
        #tv .amb { color: var(--amber); font-weight: 500; }
        #tv .vivo { color: #fff; background: var(--live); padding: 0 12px; border-radius: 6px; font-weight: 500; font-size: 20px; letter-spacing: 0.06em; }
        #tv .info .pb { margin-top: 12px; width: 480px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.22); overflow: hidden; }
        #tv .pb b { display: block; height: 100%; background: var(--amber); }
        #tv .faixa {
            margin-top: 10px;
            padding-left: 132px;
            display: flex;
            transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        #tv .card {
            position: relative;
            flex: none;
            width: 400px;
            height: 225px;
            margin-right: 30px;
            border-radius: 22px;
            background-color: #1c2438;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.16s ease;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }
        #tv .card .tvs { position: absolute; left: 14px; top: 14px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 18px; padding: 4px 12px; border-radius: 14px; background: rgba(6, 9, 20, 0.72); }
        #tv .card .novo { position: absolute; right: 14px; top: 14px; font-weight: 500; font-size: 16px; letter-spacing: 0.06em; padding: 4px 12px; border-radius: 14px; background: var(--amber); color: #fff; }
        #tv .card .pb { position: absolute; left: 18px; right: 18px; bottom: 16px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.28); overflow: hidden; }
        #tv .card .pos { position: absolute; left: 18px; bottom: 6px; font-weight: 500; font-size: 92px; line-height: 1; color: #fff; text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6); }
        #tv .card .img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; background-size: cover; background-position: center; }
        #tv .card .nm { position: absolute; left: 24px; right: 24px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 400; font-size: 28px; color: rgba(255, 255, 255, 0.85); }
        #tv .card.jogo {
            background: rgba(18, 26, 46, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #tv .card.jogo .tm { display: flex; align-items: center; font-weight: 500; font-size: 30px; white-space: nowrap; overflow: hidden; }
        #tv .card.jogo .tm + .tm { margin-top: 14px; }
        #tv .card.jogo .tm span { overflow: hidden; text-overflow: ellipsis; }
        #tv .card.jogo .tm i {
            flex: none;
            width: 46px;
            height: 46px;
            margin-right: 16px;
            border-radius: 50%;
            overflow: hidden;
            font-style: normal;
            font-weight: 500;
            font-size: 15px;
            line-height: 46px;
            text-align: center;
            letter-spacing: 0.02em;
        }
        #tv .card.jogo .tm i img { width: 100%; height: 100%; object-fit: contain; background: rgba(255, 255, 255, 0.9); }
        #tv .card.jogo .st { margin-top: 16px; display: flex; align-items: center; font-weight: 300; font-size: 22px; color: rgba(255, 255, 255, 0.75); white-space: nowrap; }
        #tv .card.jogo .st > * + * { margin-left: 12px; }
        /* Continue: the last Live channel (logo centered on a dark card, LIVE badge) */
        #tv .card.canal { background: #15120f; border: 1px solid rgba(255, 255, 255, 0.14); overflow: hidden; }
        #tv .card.canal .lg { position: absolute; left: 25%; top: 21%; width: 50%; height: 58%; object-fit: contain; }
        #tv .card.canal.temlogo .nm { display: none; }
        #tv .card .aov { position: absolute; left: 14px; top: 14px; font-weight: 500; font-size: 16px; letter-spacing: 0.06em; padding: 4px 12px; border-radius: 14px; background: var(--live); color: #fff; }
        #tv .card.mais { background: rgba(255, 255, 255, 0.1); border: 1px dashed rgba(255, 255, 255, 0.35); display: flex; align-items: center; justify-content: center; font-weight: 400; font-size: 28px; color: rgba(255, 255, 255, 0.85); box-shadow: none; }
        #tv .card.foco { transform: scale(1.06); box-shadow: 0 0 0 5px #fff, 0 18px 38px rgba(0, 0, 0, 0.5); }

        #tv .pontos {
            position: absolute;
            left: 132px;
            bottom: 58px;
            display: flex;
            align-items: center;
            font-weight: 300;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #tv.conteudo .pontos { opacity: 1; }
        #tv .pontos b { width: 10px; height: 10px; margin-right: 12px; border-radius: 5px; background: rgba(255, 255, 255, 0.35); }
        #tv .pontos b.on { width: 28px; background: var(--amber); }
        #tv .pontos svg { width: 16px; height: 16px; margin-right: 6px; }
        #tv .pontos span { margin-left: 4px; }
        #tv .offline {
            position: absolute;
            right: 96px;
            bottom: 56px;
            display: none;
            align-items: center;
            font-weight: 300;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
        }
        #tv .offline i { width: 10px; height: 10px; margin-right: 10px; border-radius: 50%; background: var(--amber); }
        #tv.semserv .offline { display: flex; }

        /* Old engine (webOS 4.x, TV 2): no blurred shadows, nothing animating the background. */
        .no-flex-gap #tv .escuro { transition: none; }
        .no-flex-gap #tv .doca-ico, .no-flex-gap #tv .card { box-shadow: none; }
        .no-flex-gap #tv .doca-app.foco .doca-ico { box-shadow: 0 0 0 5px #fff; }

            left: 0;

            justify-content: center;

        .modal-box {
            width: 960px;
            max-height: 86vh;
            background: var(--panel);

            padding: 32px 38px;

            flex-direction: column;

        .field-group { flex: 0 0 calc((100% - 16px * 2) / 3); display: flex; flex-direction: column; }
        .field-group > * + * { margin-top: 6px; }
        .field-group label { font-size: 14px; color: var(--text-secondary); }
        .field-input {
            background: rgba(0, 0, 0, 0.35);

        .toast-msg {

            'com.microsoft.xbox': 'xbox',
            'io.strem.tv': 'stremio'
        };
        // Pre-colored brand badges (full artwork, own background and contrast already
        // built in) that must render edge-to-edge, not recolored/shrunk like the
        // Simple Icons SVGs in APP_LOGOS. Checked before APP_LOGOS and the device icon,
        // and wins over both, so the app's own icon (sometimes outdated, as with
        // HBO Max's pre-rebrand icon.png on this TV) never overwrites it.
        var APP_ICON_OVERRIDES = {
            'com.wbd.stream': 'assets/brands/hbomax.png',
            'org.webostv.play': 'assets/brands/webostvplayer.png',
            // Our YouTube (youtube-webos fork): the dark version of the logo, so it stands
            // apart from the official app's red tile.
            'org.webostv.youtube': 'assets/brands/webostvyoutube.png'
        };

        function addTileImage(container, url, branded, cover) {
            var img = document.createElement('img');
            img.alt = '';
            if (branded) img.className = 'tile-brand-logo';
            // Full-bleed badges (APP_ICON_OVERRIDES): .app-icon isn't square in every
            // context (158x117 on the shelf, 1:1 in the All Apps drawer), so
            // object-fit: contain letterboxes and the tile's own background color
            // shows through the gap. cover fills it edge to edge instead; the source
            // image needs enough margin around the mark to survive that crop.
            if (cover) img.style.objectFit = 'cover';
            var fallback = container.firstElementChild;
            if (fallback) fallback.style.visibility = 'hidden';
            img.onload = function() { if (fallback) fallback.style.visibility = 'hidden'; };
            img.onerror = function() { img.remove(); if (fallback) fallback.style.visibility = ''; };
            img.src = url;
            container.appendChild(img);
        }

        // Root helper on the TV (/var/lib/webosbrew/webostv-helper, started at boot,
        // 127.0.0.1 only). As Home this app can't read other apps' icons over file:// nor
        // list/close running apps on the Luna bus; the helper does both as root.
        var TV_HELPER = 'http://127.0.0.1:3911';

        // Branded override (full-bleed) > Simple Icons mark > the app's own launcher icon
        // served by the helper, on the icon's own background color so the letterbox of a
        // square icon in the wider shelf tile blends in.
        function fillAppIcon(iconDiv, app) {
            var fallback = document.createElement('span');
            fallback.className = 'app-art-fallback';
            fallback.textContent = app.title;
            iconDiv.appendChild(fallback);
            var override = APP_ICON_OVERRIDES[app.id];
            var logo = APP_LOGOS[app.id];
            if (override) {
                addTileImage(iconDiv, override, false, true);
            } else if (logo) {
                addTileImage(iconDiv, 'assets/brands/' + logo + '.svg', true);
            } else {
                if (app.iconBg) iconDiv.style.background = app.iconBg;
                // v: bump when the helper starts serving different art; icons are cached a day.
                addTileImage(iconDiv, TV_HELPER + '/icon?v=2&id=' + encodeURIComponent(app.id), false);
            }
        }

        // Defaults match what's actually installed on this TV (see DEFAULT_CATALOG above),
        // not a generic predefined set. Anything else is one tap away in Customize or the
        // All Apps drawer.
        var DEFAULT_FAVORITES = [
            'netflix',
            'youtube.leanback.v4',
            'com.disney.disneyplus-prod',
            'com.wbd.stream',
            'amazon',
            'globoplaywebos',
            'spotify-beehive'
        ];

        var state = {
            favorites: JSON.parse(localStorage.getItem('fmtv_favorites') || 'null') || DEFAULT_FAVORITES.slice(),

            ajuste: svgIcon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>', LINE + ' stroke="#fff" stroke-width="1.8"'),
            ok: svgIcon('<path d="M5 12.5l4.5 4.5L19 7.5"/>', LINE + ' stroke="#fff" stroke-width="2.4"'),
            fechar: svgIcon('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>', LINE + ' stroke="#fff" stroke-width="2.4"'),
            baixo: svgIcon('<path d="M6 9.5l6 6 6-6"/>', LINE + ' stroke="currentColor" stroke-width="2.4"'),
            cima: svgIcon('<path d="M6 14.5l6-6 6 6"/>', LINE + ' stroke="currentColor" stroke-width="2.4"')
        };

        // --- Clock & Date ---
        var DIAS_PT = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
        var MESES_PT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
        var horaEl = byId('hora');
        var clockShown = '';
        var dateShown = '';

        function timeText(d) {
            var h = d.getHours();
            if (state.clockFormat === '12h') return (h % 12 || 12) + ':' + pad2(d.getMinutes()) + ' ' + (h >= 12 ? 'PM' : 'AM');
            return pad2(h) + ':' + pad2(d.getMinutes());
        }

        function dateText(d) {
            if (currentLang() === 'pt') return DIAS_PT[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES_PT[d.getMonth()];
            return d.toLocaleDateString(LANG_LOCALES[currentLang()], { weekday: 'long', month: 'long', day: 'numeric' });
        }

        /** Once a minute: the clock, the date line, the part of the day, the reminder. Each
         * only touches the DOM when its text changed. */
        function updateClock() {
            var now = new Date();
            var ts = timeText(now);
            if (ts !== clockShown) {
                clockShown = ts;
                horaEl.textContent = ts;
            }
            dateShown = dateText(now);
            applyPeriod(now);
            renderLinha();
            renderAviso();
        }

        // The clock shows no seconds, so it ticks once per minute, on the minute boundary
        // (+50 ms so the new minute has surely begun), not every second. Stopped while the
        // page is hidden (onPageHidden) and restarted by onPageShown.
        var clockTimer = null;
        var clockDueAt = 0; // wall-clock time of the next minute change
        function scheduleClock() {
            clearTimeout(clockTimer);
            var now = Date.now();
            clockDueAt = now - now % 60000 + 60000;
            clockTimer = setTimeout(function() {
                clockTimer = null;
                if (document.hidden) return;
                updateClock();
                scheduleClock();
            }, clockDueAt - now + 50);
        }

        // --- Wallpaper: part of the day ---
        // Morning from 06:00, afternoon from 11:00, "late afternoon" the 2 h before sunset
        // (homeserver's clima.por_do_sol, else 19:00), night after it. Checked on the minute
        // tick; the class only changes at those boundaries.
        var papelEl = byId('papel');
        var periodShown = '';

        function sunsetMinutes() {
            var c = launcher.data && launcher.data.clima;
            var m = c && /^(\d{1,2}):(\d{2})/.exec(String(c.por_do_sol || ''));
            return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : 19 * 60;
        }

        function periodAt(d) {
            var min = d.getHours() * 60 + d.getMinutes();
            var sunset = sunsetMinutes();
            if (min < 6 * 60 || min >= sunset) return 'noite';
            if (min < 11 * 60) return 'manha';
            if (min < sunset - 120) return 'tarde';
            return 'fim';
        }

        function applyPeriod(d) {
            var p = periodAt(d);
            if (p === periodShown) return;
            periodShown = p;   // ainda decide sol/lua do ícone do tempo
            // Fundo fixo no da noite, o mais escuro (pedido 09/11): sem alternar pela hora do dia.
            papelEl.className = 'papel noite';
        }

        // --- Date / weather line, corner weather, next reminder ---
        var CLIMA_MAX_MS = 3 * 60 * 60 * 1000;   // older weather is hidden, not shown stale
        var AVISO_PASSADO_MS = 30 * 60 * 1000;   // a reminder this far past its time is dropped

        function climaAtual() {
            var c = launcher.data && launcher.data.clima;
            if (!c || c.temp == null) return null;
            var em = Date.parse(c.em || '');
            if (isNaN(em) || Date.now() - em > CLIMA_MAX_MS) return null;
            return c;
        }

        /** Sky icon name: the homeserver's, with sun/moon by the part of the day (sunset). */
        function climaIconName(c) {
            var name = String(c.icone || 'nuvem');
            if (periodShown === 'noite' && name === 'sol') name = 'lua';
            if (periodShown && periodShown !== 'noite' && name === 'lua') name = 'sol';
            return ICONS[name] ? name : 'nuvem';
        }

        function climaIcon(c) {
            return ICONS[climaIconName(c)];
        }

        // Big sky icons for the weather block (168x168): sun and moon drawn for that size;
        // cloud, drizzle, rain, storm, snow, fog reuse the small drawings in the warm cloud color.
        var ICONS_G = {
            sol: '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="13" fill="#f3c56b"/><g stroke="#f3c56b" stroke-width="3.2" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g></svg>',
            lua: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M50 38A20 20 0 1 1 26 14a16 16 0 0 0 24 24z" fill="#dfe3f2"/></svg>'
        };
        function climaIconG(c) {
            var name = climaIconName(c);
            return ICONS_G[name] || ICONS[name].replace(/#e6e9f0/g, '#e9e4dc');
        }

        /** Big weather block (resting): icon + temperature, sky · max/min, city · sunset. */
        function climaHtml(c) {
            if (!c) return '';
            var d0 = c.dias && c.dias[0];
            var ceu = String(c.ceu || '');
            if (d0 && d0.max != null && d0.min != null) ceu += (ceu ? ' · ' : '') + t('max %s° min %s°', d0.max, d0.min);
            var cid = [];
            if (c.cidade) cid.push(String(c.cidade));
            if (c.por_do_sol) cid.push(t('sunset %s', c.por_do_sol));
            return '<div class="agora">' + climaIconG(c) + '<div class="temp">' + esc(c.temp + '°') + '</div></div>' +
                (ceu ? '<div class="ceu">' + esc(ceu) + '</div>' : '') +
                (cid.length ? '<div class="cid">' + esc(cid.join(' · ')) + '</div>' : '');
        }

        function renderLinha() {
            var c = climaAtual();
            // under the clock, only the date: the weather has its own block on the right (pedido 09/11 noite)
            setHtml(byId('linha'), '<span>' + esc(dateShown) + '</span>');
            var clima = byId('clima');
            var g = climaHtml(c);
            setHtml(clima, g);
            clima.classList.toggle('oculto', !g);
            var canto = byId('canto');
            var k = c ? climaIcon(c) + '<span>' + esc(c.temp + '°' + (c.cidade ? ' · ' + c.cidade : '')) + '</span>' : '';
            setHtml(canto, k);
            canto.classList.toggle('oculto', !k);
        }

        function renderAviso() {
            var a = launcher.data && launcher.data.aviso;
            var txt = a && a.texto ? String(a.texto) : '';
            if (txt && a.quando) {
                var q = Date.parse(a.quando);
                if (!isNaN(q) && Date.now() - q > AVISO_PASSADO_MS) txt = '';
            }
            var el = byId('aviso');
            setHtml(el, txt ? ICONS.sino + '<span>' + esc(txt) + '</span>' : '');
            el.classList.toggle('oculto', !txt);
        }

        // --- Toast Helper ---
        var toastEl = byId('toastMsg');
        function showToast(msg, duration) {
            toastEl.textContent = msg;
            toastEl.style.display = 'block';
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(function() { toastEl.style.display = 'none'; }, duration || 2400);
        }

        function applyTextSize() {
            var root = document.documentElement;
            root.classList.remove('ts-large');
            root.classList.remove('ts-xlarge');
            if (state.textSize === 'large' || state.textSize === 'xlarge') root.classList.add('ts-' + state.textSize);
        }

        var PLAYER_ID = 'org.webostv.play';

        // --- Apps being updated or installed (LG Content Store, dev installs): their tiles get a
        // spinner and the progress. The root helper reads appInstallService (the page can't);
        // polled every 15 s, every 2 s while something installs, every minute when hidden
        // (whether or not something installs: nobody sees the progress then, and onPageShown
        // polls at once on return).
        var updatingApps = [];
        var updatePollTimer = null;
        function pollUpdatingApps() {
            clearTimeout(updatePollTimer);
            if (typeof fetch !== 'function') return;
            var before = updatingApps.length;
            fetch(TV_HELPER + '/installing')
                .then(function(res) { return res.ok ? res.json() : { apps: [] }; })
                .then(function(d) {
                    updatingApps = d.apps || [];
                    showUpdatingApps();
                    if (before && updatingApps.length < before) discoverTVApps(); // finished: new icon/title
                }, function() {})
                .then(function() {
                    updatePollTimer = setTimeout(pollUpdatingApps, document.hidden ? 60000 : (updatingApps.length ? 2000 : 5000));
                });
        }
        /** Installs in progress: an amber ring on the dock icon (its name then says how far it
         * got), and the veil with spinner and bar on the All Apps tiles. */
        function showUpdatingApps() {
            var byAppId = {};
            updatingApps.forEach(function(a) { byAppId[a.id] = a; });
            function statusText(a) {
                return a.step === 'remove' ? t('Removing')
                    : (a.progress != null ? t('Updating %s%', a.progress) : t('Updating…'));
            }
            // pill under the clock: every app installing now, in the dock or not (pedido 09/11)
            var box = byId('instalando');
            var lista = updatingApps.slice(0, 2);
            var chave = lista.map(function(a) { return a.id; }).join('|');
            if (box._chave !== chave) {   // rebuilt only when the set changes: the spinner keeps turning
                box._chave = chave;
                box.innerHTML = lista.map(function() {
                    return '<div class="it"><span class="gira"></span><span class="tx"></span><span class="pb"><i></i></span></div>';
                }).join('');
            }
            toArray(box.children).forEach(function(el, i) {
                var a = lista[i];
                var c = arrFind(state.catalog, function(x) { return x.id === a.id; });
                var tx = ((c && c.title) || a.title || a.id) + ' · ' + statusText(a);
                var txEl = el.querySelector('.tx');
                if (txEl.textContent !== tx) txEl.textContent = tx;
                var pb = el.querySelector('.pb');
                pb.style.display = a.progress != null ? '' : 'none';
                pb.firstChild.style.width = Math.max(0, Math.min(100, a.progress || 0)) + '%';
            });
            box.classList.toggle('oculto', !lista.length);
            toArray(trilhoEl.children).forEach(function(el) {
                var a = byAppId[el.dataset.id];
                var ring = el.querySelector('.anel');
                var nome = el.querySelector('.nome');
                if (!a) {
                    if (ring) el.removeChild(ring);
                    if (nome && nome.textContent !== el._title) nome.textContent = el._title;
                    return;
                }
                if (!ring) {
                    ring = document.createElement('span');
                    ring.className = 'anel';
                    el.appendChild(ring);
                }
                var text = el._title + ' · ' + statusText(a);
                if (nome && nome.textContent !== text) nome.textContent = text;
            });
            toArray(document.querySelectorAll('.all-app-tile')).forEach(function(tile) {
                var a = byAppId[tile.dataset.id];
                var veil = tile.querySelector('.update-veil');
                tile.classList.toggle('updating', !!a);
                if (!a) {
                    if (veil) veil.parentNode.removeChild(veil);
                    return;
                }
                if (!veil) {
                    veil = document.createElement('div');
                    veil.className = 'update-veil';
                    veil.appendChild(document.createElement('div')).className = 'update-spin';
                    veil.appendChild(document.createElement('div')).className = 'update-text';
                    var bar = veil.appendChild(document.createElement('div'));
                    bar.className = 'update-bar';
                    bar.appendChild(document.createElement('div'));
                    tile.appendChild(veil);
                }
                veil.querySelector('.update-text').textContent = statusText(a);
                var fill = veil.querySelector('.update-bar div');
                fill.parentNode.style.visibility = a.progress != null ? 'visible' : 'hidden';
                fill.style.width = (a.progress || 0) + '%';
            });
        }

        // --- Apps open in the background (white dot under the dock icon) ---
        // Read from the helper on boot, on every return to Home and after the Running Apps
        // list closes something: nothing else changes it while the Home is in front.
        var runningIds = {};
        function setRunning(list) {
            var map = {};
            (list || []).forEach(function(a) { if (a && a.id) map[a.id] = 1; });
            runningIds = map;
            showRunningDots();
        }
        function refreshRunning() {
            if (typeof fetch !== 'function') return;
            fetch(TV_HELPER + '/running')
                .then(function(res) { return res.json(); })
                .then(function(data) { setRunning(data && data.running); }, function() {});
        }
        function showRunningDots() {
            toArray(trilhoEl.children).forEach(function(el) {
                var id = el.dataset.id;
                var on = !!(id && runningIds[id]);
                var dot = el.querySelector('.on');
                if (on && !dot) {
                    dot = document.createElement('span');
                    dot.className = 'on';
                    el.appendChild(dot);
                } else if (!on && dot) {
                    el.removeChild(dot);
                }
            });
        }

        // --- Discover Installed Apps from LG webOS ---
        // installedIds (optional, from the root helper): every app id on the TV. When given,
        // catalog entries for apps this TV doesn't have are dropped, so the shelf and All
        // Apps only show what is really installed (the defaults mirror the first TV).
        function addLaunchPoints(launchPoints, installedIds) {
            if (installedIds && installedIds.length) {
                var installed = {};
                installedIds.forEach(function(id) { installed[id] = 1; });
                launchPoints.forEach(function(lp) { installed[lp.appId || lp.id] = 1; });
                state.catalog = state.catalog.filter(function(c) { return installed[c.id]; });
            }
            launchPoints.forEach(function(lp) {
                var appId = lp.appId || lp.id;
                if (!appId) return;
                var exists = arrFind(state.catalog, function(c) { return c.id === appId; });
                if (exists && lp.iconColor) exists.iconBg = lp.iconColor;
                if (lp.systemApp && !exists) return;
                if (!exists) {
                    state.catalog.push({
                        id: appId,
                        title: lp.title || lp.id,
                        tag: 'Installed App',
                        desc: lp.appDescription || ('Launch ' + (lp.title || lp.id) + ' natively on your LG TV.'),
                        color: lp.iconColor || '#0a84ff',
                        badge: (lp.title || 'APP').substring(0, 3).toUpperCase(),
                        iconBg: lp.iconColor,
                        bg: 'linear-gradient(135deg, ' + (lp.iconColor || '#2a344a') + ', #101420)'
                    });
                }
            });
            renderAppsShelf();
        }

        // The root helper answers for every app id (the Home is denied listLaunchPoints on
        // webOS 10); without it, fall back to Luna and then to the SSAP socket.
        // Also runs on every return to Home, on opening All Apps and twice after boot (an app
        // installed while another app was in front never showed up, and right after the
        // boot-time sam restart the list can come back short): the shelf is only rebuilt
        // when the list actually changed, then onChange runs. helperOnly skips the
        // fallbacks (the SSAP one can raise a pairing prompt).
        var appsSeen = '';
        function discoverTVApps(helperOnly, onChange) {
            if (typeof fetch !== 'function') { if (!helperOnly) discoverViaLuna(); return; }
            fetch(TV_HELPER + '/apps')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (!data || !Array.isArray(data.launchPoints)) throw new Error('no apps');
                    var seen = data.launchPoints.map(function(lp) {
                        return (lp.appId || lp.id) + '|' + lp.title + '|' + lp.icon;
                    }).join(',') + '#' + (data.installed || []).join(',');
                    if (seen === appsSeen) return;
                    appsSeen = seen;
                    addLaunchPoints(data.launchPoints, data.installed);
                    if (onChange) onChange();
                })
                .catch(function() { if (!helperOnly) discoverViaLuna(); });
        }

        function discoverViaLuna() {
            if (!window.webOS || !window.webOS.service) return;
            try {
                webOS.service.request("luna://com.webos.applicationManager", {
                    method: "listLaunchPoints",
                    parameters: {},
                    onSuccess: function(res) {
                        if (res && Array.isArray(res.launchPoints)) addLaunchPoints(res.launchPoints);
                    },
                    // Newer webOS (seen on SDK 10.x) denies listLaunchPoints to Dev Mode apps.
                    onFailure: function() { discoverViaSSAP(0); }
                });
            } catch (e) {}
        }

        // The TV's own remote-control socket still lists installed apps once the
        // viewer accepts a one-time on-screen pairing prompt. The client key it
        // returns is kept so later launches skip the prompt. Right after an app
        // (re)launch the socket sometimes drops or ignores the connection, so a failed
        // attempt is retried; a shown prompt or a refusal is never retried.
        var SSAP_RETRY_MS = [2000, 5000, 15000];
        function discoverViaSSAP(attempt) {
            attempt = attempt || 0;
            var ws, timer;
            var settled = false;
            var prompted = false;
            function finish(retry) {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                try { ws.close(); } catch (e) {}
                if (retry && attempt < SSAP_RETRY_MS.length) {
                    setTimeout(function() { discoverViaSSAP(attempt + 1); }, SSAP_RETRY_MS[attempt]);
                }
            }
            function waitForReply() {
                clearTimeout(timer);
                timer = setTimeout(function() { finish(true); }, 8000);
            }
            try { ws = new WebSocket('ws://127.0.0.1:3000'); } catch (e) { finish(true); return; }
            var clientKey = null;
            try { clientKey = localStorage.getItem('fmtv_ssap_key'); } catch (e) {}
            waitForReply();
            ws.onopen = function() {
                var payload = {
                    pairingType: 'PROMPT',
                    manifest: { manifestVersion: 1, appVersion: '1.0', permissions: ['READ_INSTALLED_APPS'] }
                };
                if (clientKey) payload['client-key'] = clientKey;
                ws.send(JSON.stringify({ id: 'register', type: 'register', payload: payload }));
            };
            // Also fires after a connection error.
            ws.onclose = function() { finish(!prompted); };
            ws.onmessage = function(ev) {
                var msg;
                try { msg = JSON.parse(ev.data); } catch (e) { return; }
                if (msg.id === 'register') {
                    if (msg.type === 'response' && msg.payload && msg.payload.pairingType === 'PROMPT') {
                        // Waiting for the viewer: no timeout, and no retry that would prompt again.
                        prompted = true;
                        clearTimeout(timer);
                        showToast(t('Accept the request on screen so Free My TV can list your installed apps.'), 15000);
                    } else if (msg.type === 'registered') {
                        try { localStorage.setItem('fmtv_ssap_key', msg.payload['client-key']); } catch (e) {}
                        ws.send(JSON.stringify({ id: 'apps', type: 'request', uri: 'ssap://com.webos.applicationManager/listLaunchPoints' }));
                        waitForReply();
                    } else if (msg.type === 'error') {
                        finish(false);
                    }
                } else if (msg.id === 'apps') {
                    if (msg.payload && Array.isArray(msg.payload.launchPoints)) addLaunchPoints(msg.payload.launchPoints);
                    finish(false);
                }
            };
        }

        // --- Native webOS App Launch ---
        var shelfEdit = null;
        var movingTileId = null;
        var pendingLaunch = null;
        // Deep links: only targets of this shape may reach the Luna launch call (the legacy
        // fallback below also interpolates them into a shell command). Today that's WebOS TV
        // Player's "abrir?titulo=..." requests (openInPlayer); plain https URLs pass too.
        // No quotes, backslashes or shell metacharacters, since the Homebrew fallback puts
        // the launch JSON inside a single-quoted shell argument.
        var DEEP_LINK_RE = /^[A-Za-z0-9 :\/?&=%._~+#,-]{1,600}$/;

        function launchApp(appId, contentTarget) {
            var launchParams = { id: appId };
            if (contentTarget && DEEP_LINK_RE.test(contentTarget)) {
                launchParams.params = { contentTarget: contentTarget };
            }
            else contentTarget = '';
            if (shelfEdit || pendingLaunch) return; // Ignore repeated remote presses while a request is pending.
            var app = arrFind(state.catalog, function(item) { return item.id === appId; });
            var title = app ? (devicePreset(app, state.hdmiDevices).title || app.title) : appId;
            if (!window.webOS || !window.webOS.service || typeof window.webOS.service.request !== 'function') {
                showToast(t('Open %s on your LG TV. Launching is unavailable in this preview.', title), 5000);
                return;
            }
            var request = { timer: null };
            pendingLaunch = request;
            var tiles = toArray(document.querySelectorAll('.doca-app')).filter(function(tile) { return tile.dataset.id === appId; });
            tiles.forEach(function(tile) { tile.setAttribute('aria-busy', 'true'); });
            function finish(message) {
                if (pendingLaunch !== request) return;
                clearTimeout(request.timer);
                pendingLaunch = null;
                tiles.forEach(function(tile) { tile.removeAttribute('aria-busy'); });
                showToast(message, 5000);
            }
            function failure(error) {
                var detail = error && error.errorText || '';
                if (/not installed|not found|does not exist|unknown app/i.test(detail)) {
                    finish(t('%s is not installed or is unavailable on this TV.', title));
                } else {
                    finish(t('Could not open %s. Check that it is installed, then try again.', title));
                }
            }
            // The root helper launches first: as LG's Home on webOS 4.x the page's own launch
            // call is refused without any reply. Without the helper, the page's Luna call,
            // then the Homebrew Channel exec.
            function viaHelper() {
                if (typeof fetch !== 'function') { viaLuna(); return; }
                fetch(TV_HELPER + '/launch?id=' + encodeURIComponent(appId) +
                        (contentTarget ? '&target=' + encodeURIComponent(contentTarget) : ''))
                    .then(function(res) {
                        // An older helper without /launch answers 404: use the other routes.
                        if (!res.ok) throw new Error('helper ' + res.status);
                        return res.json();
                    })
                    .then(function(reply) {
                        if (pendingLaunch !== request) return;
                        if (reply && reply.returnValue === true) finish(t('Opening %s…', title));
                        else if (reply && reply.returnValue === false) failure(reply);
                        else viaLuna();
                    })
                    .catch(viaLuna);
            }
            function viaLuna() {
                if (pendingLaunch !== request) return;
                try {
                    webOS.service.request('luna://com.webos.applicationManager', {
                        method: 'launch',
                        parameters: launchParams,
                        onSuccess: function(result) {
                            if (pendingLaunch !== request) return;
                            if (result && result.returnValue === false) fallback(result);
                            else finish(t('Opening %s…', title));
                        },
                        onFailure: fallback
                    });
                } catch (e) { failure(e); }
            }
            function fallback(originalError) {
                if (pendingLaunch !== request) return;
                // Only known app-ID characters may enter the legacy shell-based fallback.
                if (!/^[a-zA-Z0-9._-]+$/.test(appId)) { failure(originalError); return; }
                try {
                    webOS.service.request('luna://org.webosbrew.hbchannel.service', {
                        method: 'exec',
                        parameters: { command: "luna-send-pub -n 1 luna://com.webos.applicationManager/launch '" + JSON.stringify(launchParams) + "'" },
                        onSuccess: function(result) {
                            // Successful exec alone does not confirm that the destination opened.
                            if (pendingLaunch !== request) return;
                            var reply = null;
                            try { reply = JSON.parse(result && result.stdout || ''); } catch (e) {}
                            if (reply && reply.returnValue === true) finish(t('Opening %s…', title));
                            else if (reply && reply.returnValue === false) failure(reply);
                            else finish(t('Could not confirm %s opened. Please try again.', title));
                        },
                        onFailure: function() { failure(originalError); }
                    });
                } catch (e) { failure(originalError); }
            }
            showToast(t('Opening %s…', title), 8000);
            request.timer = setTimeout(function() {
                finish(t('No response opening %s. Please try again.', title));
            }, 8000);
            viaHelper();
        }

        // --- Homeserver: everything the Home shows besides the apps, in one call ---
        // GET <base>/api/play/launcher?v=<last v>&fundo=&poster= answers {v, destaque, continuar,
        // jogos, recomendados, top_brasil, aviso, clima}, or {v, igual:true} when nothing changed.
        // Asked on boot, on every return to Home and once a minute while the Home is in front.
        // The last full answer is kept in localStorage: with the homeserver down the Home shows
        // that copy (and says so); with no copy at all, only the clock and the dock. Apps, the
        // clock, Customize and All apps never depend on it.
        var HS_PATH = '/api/play/launcher';
        var HS_DEFAULTS = ['http://homeserver:8080', 'http://192.168.1.10:8080'];
        var HS_KEY = 'fmtv_homeserver';         // last base that answered
        var LAUNCHER_KEY = 'fmtv_launcher';     // last full answer {base, at, d}
        var HS_TIMEOUT_MS = 6000;
        var LAUNCHER_REFRESH_MS = 60 * 1000;
        // Card art is 400x225 (424 wide in focus) on both TVs: w780 is already 2x that, and
        // w1280 would decode almost 3x the pixels per card for nothing. Posters aren't shown.
        var IMG_FUNDO = 'w780';
        var IMG_POSTER = OLD_ENGINE ? 'w185' : 'w342';
        var IMG_PATH_RE = /^\/api\/play\/img\/[^\s"'()\\]+$/;
        var URL_RE = /^https?:\/\/[^\s"'()\\]+$/;

        var launcher = { data: null, base: '', online: null, fetching: false };

        /** Bases to try, in order: the last one that answered, FMTV_HOMESERVER (defaults.js,
         * a string or a list), then the defaults. */
        function hsCandidates() {
            var list = [];
            function add(b) {
                if (typeof b !== 'string') return;
                b = b.replace(/\/+$/, '');
                if (URL_RE.test(b) && list.indexOf(b) === -1) list.push(b);
            }
            try { add(localStorage.getItem(HS_KEY)); } catch (e) {}
            var forced = window.FMTV_HOMESERVER;
            if (forced && typeof forced.forEach === 'function') forced.forEach(add);
            else add(forced);
            HS_DEFAULTS.forEach(add);
            return list;
        }

        /** fetch + JSON with a timeout (no AbortController before Chromium 66: a late answer
         * is just ignored). */
        function fetchJSON(url, ms) {
            return new Promise(function(resolve, reject) {
                var settled = false;
                var timer = setTimeout(function() {
                    settled = true;
                    reject(new Error('timeout'));
                }, ms);
                fetch(url)
                    .then(function(res) {
                        if (!res.ok) throw new Error('http ' + res.status);
                        return res.json();
                    })
                    .then(function(d) {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        resolve(d);
                    }, function(err) {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        reject(err);
                    });
            });
        }

        function loadCachedLauncher() {
            try {
                var saved = JSON.parse(localStorage.getItem(LAUNCHER_KEY) || 'null');
                if (saved && saved.d && saved.d.v) {
                    launcher.data = saved.d;
                    launcher.base = saved.base || '';
                }
            } catch (e) {}
        }

        function setOnline(on) {
            launcher.online = on;
            tvEl.classList.toggle('semserv', !on && !!launcher.data);
        }

        function refreshLauncher() {
            if (launcher.fetching || typeof fetch !== 'function') return;
            launcher.fetching = true;
            var bases = hsCandidates();
            var v = launcher.data ? launcher.data.v : '';
            var i = 0;
            function next() {
                if (i >= bases.length) {
                    launcher.fetching = false;
                    setOnline(false);
                    return;
                }
                var base = bases[i++];
                var url = base + HS_PATH + '?v=' + encodeURIComponent(v || '') + '&fundo=' + IMG_FUNDO + '&poster=' + IMG_POSTER;
                fetchJSON(url, HS_TIMEOUT_MS)
                    .then(function(d) {
                        if (!d || typeof d !== 'object' || !d.v || (d.igual && !launcher.data)) throw new Error('bad answer');
                        launcher.fetching = false;
                        var baseChanged = base !== launcher.base;
                        launcher.base = base;
                        try { localStorage.setItem(HS_KEY, base); } catch (e) {}
                        if (!d.igual) {
                            launcher.data = d;
                            try { localStorage.setItem(LAUNCHER_KEY, JSON.stringify({ base: base, at: Date.now(), d: d })); } catch (e) {}
                        }
                        setOnline(true);
                        if (!d.igual || baseChanged) renderLauncherData();
                    })
                    .catch(next);
            }
            next();
        }

        var launcherTimer = null;
        function startLauncherTimer() {
            clearInterval(launcherTimer);
            launcherTimer = setInterval(function() {
                if (!document.hidden) refreshLauncher();
            }, LAUNCHER_REFRESH_MS);
        }

        /** Image paths come relative (/api/play/img/...): prefixed with the base that answered. */
        function imgUrl(path) {
            path = String(path || '');
            if (URL_RE.test(path)) return path;
            if (!IMG_PATH_RE.test(path)) return '';
            return (launcher.base || hsCandidates()[0] || '') + path;
        }

        // --- Rows: one on screen at a time, empty ones left out ---
        var ROW_DEFS = [
            { key: 'continuar', name: 'Continue' },
            { key: 'jogos', name: "Today's games" },
            { key: 'recomendados', name: 'For you' },
            { key: 'top_brasil', name: 'Top Brazil' }
        ];
        var MAX_CARDS = 20;   // Top 20 (pedido 09/11); o servidor já limita cada fileira a 20
        var rows = [];
        var rowStamp = 0; // bumped on new data: the row on screen is rebuilt

        function buildRows() {
            var d = launcher.data;
            var out = [];
            if (!d) return out;
            ROW_DEFS.forEach(function(def) {
                var list = Array.isArray(d[def.key]) ? d[def.key] : [];
                var items;
                if (def.key === 'jogos') {
                    // Finished games have nothing left to open.
                    items = list.filter(function(j) { return j && j.status !== 'fim'; }).slice(0, MAX_CARDS - 1);
                    if (items.length) items.push({ mais: true });
                } else {
                    items = list.filter(function(c) { return c && c.id != null; }).slice(0, MAX_CARDS);
                }
                if (items.length) out.push({ key: def.key, name: def.name, items: items });
            });
            return out;
        }

        /** Where Down lands: the homeserver's destaque ({fileira, i}) when that row is shown,
         * else the first row. */
        function destaqueSpot() {
            var d = launcher.data && launcher.data.destaque;
            if (d && d.fileira) {
                var sec = arrFindIndex(rows, function(r) { return r.key === d.fileira; });
                if (sec !== -1) {
                    var src = launcher.data[d.fileira];
                    var wanted = Array.isArray(src) ? src[d.i || 0] : null;
                    var item = wanted ? rows[sec].items.indexOf(wanted) : -1;
                    return { sec: sec, item: item === -1 ? 0 : item };
                }
            }
            return { sec: 0, item: 0 };
        }

        function renderLauncherData() {
            var shownKey = nav.modo === 'prat' && rows[nav.sec] ? rows[nav.sec].key : null;
            rows = buildRows();
            rowStamp++;
            applyPeriod(new Date());
            renderLinha();
            renderAviso();
            renderHint();
            if (nav.modo === 'prat') {
                if (!rows.length) nav.modo = 'doca';
                else {
                    var idx = arrFindIndex(rows, function(r) { return r.key === shownKey; });
                    nav.sec = idx !== -1 ? idx : Math.min(nav.sec, rows.length - 1);
                }
                render();
            }
        }

        // --- Screen state ---
        // modo 'doca' (resting: big clock and the dock) or 'prat' (a content row below).
        var nav = { modo: 'doca', app: 0, sec: 0, item: 0 };
        var dockItems = [];
        var DOCK_STEP = 166;              // 132 icon + 34 margin
        var DOCK_VIEW = 1920 - 132 - 96;  // visible dock width
        var CARD_STEP = 430;              // 400 card + 30 margin
        var dockShift = -1;
        var faixaShift = -1;
        var faixaFor = '';                // row (and data stamp) whose cards are in the DOM
        var focusedDockEl = null;
        var focusedCardEl = null;
        var clearFaixaTimer = null;

        function render() {
            tvEl.classList.toggle('conteudo', nav.modo === 'prat');
            renderDockFocus();
            if (nav.modo === 'prat') {
                clearTimeout(clearFaixaTimer);
                renderShelf();
            } else {
                // Off screen once the row has faded out: drop its cards and their images.
                clearTimeout(clearFaixaTimer);
                clearFaixaTimer = setTimeout(clearFaixa, 500);
            }
        }

        function clearFaixa() {
            clearTimeout(clearFaixaTimer);
            if (nav.modo === 'prat') return;
            faixaEl.innerHTML = '';
            faixaEl.style.transform = '';
            faixaFor = '';
            faixaShift = -1;
            focusedCardEl = null;
            setHtml(byId('info'), '');
        }

        // --- Dock ---
        function dockElement(it) {
            var el = document.createElement('div');
            el.className = 'doca-app';
            var ico = document.createElement('div');
            ico.className = 'doca-ico';
            var title;
            if (it.kind === 'app') {
                var app = it.app;
                var device = devicePreset(app, state.hdmiDevices);
                title = device.title || app.title;
                el.dataset.id = app.id;
                ico.style.background = app.bg || '#1c2438';
                if (isHDMI(app)) {
                    ico.style.background = device.color;
                    if (device.logo) {
                        var fallback = document.createElement('span');
                        fallback.className = 'app-art-fallback';
                        fallback.textContent = device.title;
                        ico.appendChild(fallback);
                        addTileImage(ico, 'assets/brands/' + device.logo + '.svg', true);
                    } else {
                        ico.innerHTML = deviceArtwork(device.shape);
                    }
                } else {
                    fillAppIcon(ico, app);
                }
            } else {
                el.className += ' vidro';
                ico.innerHTML = { all: ICONS.apps, settings: ICONS.ajuste, done: ICONS.ok, cancel: ICONS.fechar }[it.kind];
                title = t({ all: 'All apps', settings: 'Settings', done: 'Done', cancel: 'Cancel' }[it.kind]);
            }
            var nome = document.createElement('span');
            nome.className = 'nome';
            nome.textContent = title;
            el.appendChild(ico);
            el.appendChild(nome);
            el._title = title;
            el.addEventListener('mouseenter', function() {
                if (modalOpen) return;
                nav.app = toArray(trilhoEl.children).indexOf(el);
                nav.modo = 'doca';
                render();
            });
            el.addEventListener('click', function() {
                if (modalOpen) return;
                nav.app = toArray(trilhoEl.children).indexOf(el);
                activateDock(nav.app);
            });
            return el;
        }

        /** Rebuilds the dock (favorites + All apps + Settings; while reordering, + Done + Cancel).
         * Named as before: app discovery calls it whenever the installed list changes. */
        function renderAppsShelf() {
            dockItems = [];
            (shelfEdit || state.favorites).forEach(function(id) {
                var app = arrFind(state.catalog, function(c) { return c.id === id; });
                if (app) dockItems.push({ kind: 'app', app: app });
            });
            if (shelfEdit) dockItems.push({ kind: 'done' }, { kind: 'cancel' });
            else dockItems.push({ kind: 'all' }, { kind: 'settings' });
            trilhoEl.innerHTML = '';
            dockItems.forEach(function(it) { trilhoEl.appendChild(dockElement(it)); });
            nav.app = Math.max(0, Math.min(nav.app, dockItems.length - 1));
            focusedDockEl = null;
            dockShift = -1;
            showUpdatingApps();
            showRunningDots();
            renderDockFocus();
            renderHint();
        }

        function renderDockFocus() {
            var els = trilhoEl.children;
            var el = nav.modo === 'doca' ? els[nav.app] || null : null;
            if (focusedDockEl !== el) {
                if (focusedDockEl) focusedDockEl.classList.remove('foco');
                if (el) el.classList.add('foco');
                focusedDockEl = el;
            }
            for (var i = 0; i < els.length; i++) {
                els[i].classList.toggle('movendo', !!shelfEdit && !!movingTileId && els[i].dataset.id === movingTileId);
            }
            if (nav.modo !== 'doca') return;
            // Keeps the focused icon in view when the dock is wider than the screen.
            var shift = Math.max(0, nav.app * DOCK_STEP + 132 + 40 - DOCK_VIEW);
            if (shift !== dockShift) {
                dockShift = shift;
                trilhoEl.style.transform = shift ? 'translateX(' + (-shift) + 'px)' : '';
            }
        }

        function renderHint() {
            var el = byId('descer');
            var h = '';
            if (shelfEdit) {
                h = '<span>' + esc(t(movingTileId ? '← / → Move • OK Place • Back Cancel' : 'Select a tile • OK Pick up • Done to save')) + '</span>';
            } else if (rows.length) {
                var first = destaqueSpot().sec;
                var names = rows.map(function(r, i) {
                    var n = esc(t(r.name));
                    return i === first ? '<b>' + n + '</b>' : n;
                });
                var list = names.length > 1 ? names.slice(0, -1).join(', ') + esc(t(' and ')) + names[names.length - 1] : names[0];
                h = '<i>' + ICONS.baixo + '</i><span>' + esc(t('Press down for')) + ' ' + list + '</span>';
            }
            setHtml(el, h);
            el.classList.toggle('oculto', !h);
        }

        // --- Text for cards ---
        function durText(s) {
            var m = Math.max(1, Math.round((s || 0) / 60));
            if (m < 60) return m + ' min';
            return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
        }

        function agoText(iso) {
            var at = Date.parse(iso || '');
            if (isNaN(at)) return '';
            var min = Math.round((Date.now() - at) / 60000);
            if (min < 2) return t('just now');
            if (min < 60) return t('%s min ago', min);
            var then = new Date(at);
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var days = Math.round((today.getTime() - new Date(then.getFullYear(), then.getMonth(), then.getDate()).getTime()) / 86400000);
            if (days <= 0) return t('%s h ago', Math.round(min / 60));
            if (days === 1) return t('yesterday');
            return t('%s days ago', days);
        }

        function whenText(iso) {
            var at = Date.parse(iso || '');
            if (isNaN(at)) return '';
            var d = new Date(at);
            var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() - today.getTime()) / 86400000);
            if (days === 0) return t('today %s', hm);
            if (days === 1) return t('tomorrow %s', hm);
            return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + hm;
        }

        function imdbText(n) {
            if (!n) return '';
            var s = (Math.round(n * 10) / 10).toFixed(1);
            return 'IMDb ' + (currentLang() === 'en' ? s : s.replace('.', ','));
        }

        function kindYear(c) {
            var k = c.tipo === 's' ? t('Series') : t('Movie');
            return c.ano ? k + ' · ' + c.ano : k;
        }

        function episodeText(c) {
            var p = c.progresso || {};
            if (c.selo) return String(c.selo);
            if (p.temporada) return 'T' + p.temporada + ':E' + (p.episodio || 1);
            return t('Movie');
        }

        /** Team names as the channel list writes them ("NBA Wizards" vs "Pistons"): a leading
         * all-caps league tag is moved to `liga` when the homeserver sent none. */
        function gameTeams(j) {
            var casa = String((j.casa && j.casa.nome) || '');
            var fora = String((j.fora && j.fora.nome) || '');
            var liga = j.liga ? String(j.liga) : '';
            var m = /^([A-Z]{2,5})\s+(.+)$/.exec(casa);
            if (!liga && m && fora.indexOf(m[1] + ' ') !== 0) {
                liga = m[1];
                casa = m[2];
            }
            var mf = liga && fora.indexOf(liga + ' ') === 0;
            if (mf) fora = fora.slice(liga.length + 1);
            return { casa: casa, fora: fora, liga: liga };
        }

        function scoreText(placar) {
            if (placar == null || placar === '') return '';
            if (Array.isArray(placar)) return placar.join(' × ');
            if (typeof placar === 'object') return (placar.casa != null ? placar.casa : '') + ' × ' + (placar.fora != null ? placar.fora : '');
            return String(placar);
        }

        function teamColor(name) {
            var h = 0;
            for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
            return 'hsl(' + h + ', 42%, 36%)';
        }

        function teamBadge(team, name) {
            var url = imgUrl(team && team.escudo);
            if (url) return '<i><img src="' + esc(url) + '" alt=""></i>';
            var sigla = (team && team.sigla) || name.replace(/[^A-Za-zÀ-ÿ0-9]/g, '').slice(0, 3).toUpperCase();
            return '<i style="background:' + teamColor(name) + '">' + esc(sigla) + '</i>';
        }

        /** Live: LIVE, score, minute; upcoming: when, and whether the reminder is on. liga (info
         * line only) goes in between. */
        function gameStatusHtml(j, liga) {
            var ligaHtml = liga ? '<span>' + esc(liga) + '</span>' : '';
            if (j.status === 'agora') {
                var sc = scoreText(j.placar);
                return '<span class="vivo">' + esc(t('LIVE')) + '</span>' + (sc ? '<span class="amb">' + esc(sc) + '</span>' : '') +
                    (j.minuto != null && j.minuto !== '' ? '<span>' + esc(j.minuto + "'") + '</span>' : '') + ligaHtml;
            }
            return '<span class="amb">' + esc(whenText(j.inicio)) + '</span>' + ligaHtml + '<span>' + esc(t(j.aviso ? 'reminder on' : 'Remind me')) + '</span>';
        }

        /** Program on now: 0-100 by the clock (the homeserver sends only start and end). */
        function programPct(a) {
            var i = Date.parse((a && a.inicio) || ''), f = Date.parse((a && a.fim) || '');
            if (isNaN(i) || isNaN(f) || f <= i) return null;
            return Math.max(0, Math.min(100, Math.round((Date.now() - i) * 100 / (f - i))));
        }

        function isCanal(it) { return !!it && it.tipo === 'canal'; }

        /** Continue: the last channel watched on Live. Logo centered on a dark card (the
         * name shows when there's no logo or it can't load), red LIVE badge, program bar. */
        function canalCardHtml(it) {
            var url = imgUrl(it.logo);
            var h = '<div class="card canal' + (url ? ' temlogo' : '') + '"><span class="nm">' + esc(it.nome) + '</span>';
            if (url) h += '<img class="lg" src="' + esc(url) + '" alt="">';
            h += '<span class="aov">' + esc(t('LIVE')) + '</span>';
            var pct = programPct(it.agora);
            if (pct != null) h += '<span class="pb"><b style="width:' + pct + '%"></b></span>';
            return h + '</div>';
        }

        function cardHtml(row, it) {
            if (it.mais) return '<div class="card mais">' + esc(t('Open Live')) + '</div>';
            if (row.key === 'continuar' && isCanal(it)) return canalCardHtml(it);
            if (row.key === 'jogos') {
                var tm = gameTeams(it);
                return '<div class="card jogo">' +
                    '<div class="tm">' + teamBadge(it.casa, tm.casa) + '<span>' + esc(tm.casa) + '</span></div>' +
                    '<div class="tm">' + teamBadge(it.fora, tm.fora) + '<span>' + esc(tm.fora) + '</span></div>' +
                    '<div class="st">' + gameStatusHtml(it) + '</div></div>';
            }
            // The name sits under the art: it shows when there's no art or it can't load
            // (homeserver down and the image not in the cache).
            var url = imgUrl(it.fundo);
            var h = '<div class="card"><span class="nm">' + esc(it.nome) + '</span>';
            if (url) h += '<i class="img" style="background-image:url(\'' + esc(url) + '\')"></i>';
            if (row.key === 'continuar') {
