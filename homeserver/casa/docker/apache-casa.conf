<VirtualHost *:${APACHE_PORT}>
    DocumentRoot /app/public
    <Directory /app/public>
        AllowOverride None
        Options -Indexes
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Cabeçalhos de segurança
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # COOP/CORP same-origin fora da API do Player. As TVs chamam /api/play de file:// (origem
    # null) e precisam ler JSON e imagens de outra origem; lá o PHP (Play\Api\Roteador) põe
    # CORP cross-origin. THE_REQUEST é a linha original: o FallbackResource reescreve a URI
    # para /index.php, então <LocationMatch> e REQUEST_URI não enxergam /api/play.
    Header always set Cross-Origin-Opener-Policy "same-origin" "expr=%{THE_REQUEST} !~ m#^[A-Z]+ /api/play/#"
    Header always set Cross-Origin-Resource-Policy "same-origin" "expr=%{THE_REQUEST} !~ m#^[A-Z]+ /api/play/#"
    # Sem scripts embutidos nem externos; estilos inline só por causa de style="width:%" das barras.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Header always unset X-Powered-By

    # Nada de arquivos internos pelo navegador
    <LocationMatch "^/(\.|var/|src/|views/|sql/|bin/)">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%h \"%r\" %>s %Dus"
</VirtualHost>
