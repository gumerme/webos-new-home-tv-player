                var p = it.progresso || {};
                // selo = o app onde parou (hoje só o Player guarda progresso), não a TV (pedido 09/11)
                h += '<span class="tvs">' + esc(it.app || 'WebOS TV Player') + '</span>';
                if (it.episodio_novo) h += '<span class="novo">' + esc(t('NEW EP')) + '</span>';
                if (p.pct != null) h += '<span class="pb"><b style="width:' + Math.max(0, Math.min(100, Math.round(p.pct))) + '%"></b></span>';
            }
            if (row.key === 'top_brasil' && it.posicao) h += '<span class="pos">' + esc(it.posicao) + '</span>';
            return h + '</div>';
        }

        function infoHtml(row, it) {
            var title, meta = [], bar = '', sin = '';
            if (it.mais) {
                title = t('Live');
                meta.push('<span>' + esc(t('Channels, favorites and guide')) + '</span>');
            } else if (row.key === 'jogos') {
                var tm = gameTeams(it);
                title = tm.casa + ' × ' + tm.fora;
                meta.push(gameStatusHtml(it, tm.liga));
            } else if (row.key === 'continuar' && isCanal(it)) {
                var a = it.agora;
                title = (it.numero != null ? it.numero + ' · ' : '') + it.nome;
                meta.push('<span class="vivo">' + esc(t('LIVE')) + '</span>');
                if (a && a.titulo) {
                    meta.push('<span class="amb">' + esc(a.titulo) + '</span>');
                    var fim = Date.parse(a.fim || '');
                    if (!isNaN(fim)) meta.push('<span>' + esc(t('until %s', pad2(new Date(fim).getHours()) + ':' + pad2(new Date(fim).getMinutes()))) + '</span>');
                    var pc = programPct(a);
                    if (pc != null) bar = '<div class="pb"><b style="width:' + pc + '%"></b></div>';
                } else {
                    meta.push('<span>' + esc(t('Live channel')) + '</span>');
                }
            } else if (row.key === 'continuar') {
                var p = it.progresso || {};
                title = it.nome;
                meta.push('<span class="amb">' + esc(episodeText(it)) + '</span>');
                if (p.proximo) meta.push('<span>' + esc(t('next episode')) + '</span>');
                else if (p.restante_s) meta.push('<span>' + esc(t('%s left', durText(p.restante_s))) + '</span>');
                var quando = agoText(p.quando);          // sem o nome da TV (pedido 09/11)
                if (quando) meta.push('<span>' + esc(quando) + '</span>');
                if (p.pct != null) bar = '<div class="pb"><b style="width:' + Math.max(0, Math.min(100, Math.round(p.pct))) + '%"></b></div>';
            } else {
                title = it.nome;
                if (row.key === 'top_brasil' && it.posicao) meta.push('<span class="amb">' + esc(t('No. %s today', it.posicao)) + '</span>');
                var imdb = imdbText(it.imdb);
                if (imdb) meta.push('<span' + (row.key === 'top_brasil' ? '' : ' class="amb"') + '>' + esc(imdb) + '</span>');
                meta.push('<span>' + esc(kindYear(it)) + '</span>');
                // gênero (JustWatch) e sinopse curta, vindos prontos do homeserver
                if (it.generos && it.generos.length) meta.push('<span>' + esc(it.generos.join(' · ')) + '</span>');
                if (it.sinopse) sin = '<div class="s">' + esc(it.sinopse) + '</div>';
            }
            return '<div class="t">' + esc(title) + '</div><div class="m">' + meta.join('') + '</div>' + bar + sin;
        }

        function renderShelf() {
            var row = rows[nav.sec];
            if (!row) return;
            nav.item = Math.max(0, Math.min(nav.item, row.items.length - 1));
            setHtml(byId('secoes'), rows.map(function(r, i) {
                return '<span data-i="' + i + '"' + (i === nav.sec ? ' class="on"' : '') + '>' + esc(t(r.name)) + '</span>';
            }).join(''));
            setHtml(byId('pontos'), rows.map(function(r, i) { return '<b' + (i === nav.sec ? ' class="on"' : '') + '></b>'; }).join('') +
                (rows.length > 1 ? ICONS.cima + ICONS.baixo + '<span>' + esc(t('switch rows')) + '</span>' : ''));
            var stamp = row.key + '#' + rowStamp;
            if (faixaFor !== stamp) {
                faixaFor = stamp;
                faixaEl.innerHTML = row.items.map(function(it) { return cardHtml(row, it); }).join('');
                focusedCardEl = null;
                // channel logo that can't load: the channel name shows instead
                toArray(faixaEl.querySelectorAll('img.lg')).forEach(function(im) {
                    function falhou() { im.style.display = 'none'; if (im.parentNode) im.parentNode.classList.remove('temlogo'); }
                    if (im.complete && !im.naturalWidth) falhou();
                    else im.onerror = falhou;
                });
            }
            var el = faixaEl.children[nav.item] || null;
            if (focusedCardEl !== el) {
                if (focusedCardEl) focusedCardEl.classList.remove('foco');
                if (el) el.classList.add('foco');
                focusedCardEl = el;
            }
            setHtml(byId('info'), infoHtml(row, row.items[nav.item]));
            // Slides the row so the focused card stays in view (no layout read: fixed card width).
            var x = nav.item * CARD_STEP;
            var shift = Math.min(x, Math.max(0, x + 400 - (1920 - 264) + 60));
            if (shift !== faixaShift) {
                faixaShift = shift;
                faixaEl.style.transform = shift ? 'translateX(' + (-shift) + 'px)' : '';
            }
        }

        function enterShelf() {
            if (!rows.length) return;
            var spot = destaqueSpot();
            nav.modo = 'prat';
            nav.sec = spot.sec;
            nav.item = spot.item;
            render();
        }

        // Pointer (Magic Remote): hovering a card focuses it, clicking opens it; a click on a
        // row name switches to it.
        faixaEl.addEventListener('mousemove', function(e) {
            if (modalOpen || nav.modo !== 'prat') return;
            var card = e.target.closest ? e.target.closest('.card') : null;
            var i = card ? toArray(faixaEl.children).indexOf(card) : -1;
            if (i !== -1 && i !== nav.item) {
                nav.item = i;
                renderShelf();
            }
        });
        faixaEl.addEventListener('click', function(e) {
            if (modalOpen || nav.modo !== 'prat') return;
            var card = e.target.closest ? e.target.closest('.card') : null;
            var i = card ? toArray(faixaEl.children).indexOf(card) : -1;
            var row = rows[nav.sec];
            if (i !== -1 && row && row.items[i]) {
                nav.item = i;
                openCard(row, row.items[i]);
            }
        });
        byId('secoes').addEventListener('click', function(e) {
            var i = parseInt(e.target.getAttribute && e.target.getAttribute('data-i'), 10);
            if (!isNaN(i) && rows[i] && nav.modo === 'prat') {
                nav.sec = i;
                nav.item = 0;
                renderShelf();
            }
        });

        // --- OK ---
        function activateDock(i) {
            var it = dockItems[i];
            if (!it) return;
            if (shelfEdit) {
                if (it.kind === 'done') finishShelfEdit(true);
                else if (it.kind === 'cancel') finishShelfEdit(false);
                else if (it.kind === 'app') {
                    movingTileId = movingTileId === it.app.id ? null : it.app.id;
                    renderDockFocus();
                    renderHint();
                }
                return;
            }
            if (it.kind === 'all') openAllAppsModal();
            else if (it.kind === 'settings') openSettingsModal();
            else if (it.kind === 'app') launchApp(it.app.id);
        }

        function targetValue(v) {
            return encodeURIComponent(String(v)).replace(/[!'()*]/g, function(c) {
                return '%' + c.charCodeAt(0).toString(16).toUpperCase();
            });
        }

        /** Opens WebOS TV Player 2.0 at a title, an episode or a channel. Sent as the
         * contentTarget "abrir?<acao>=<id>&..." (the shape both launch paths here carry: the
         * helper's /launch?target= and Luna's params.contentTarget), which the Player turns
         * into its {abrir, id, temporada, episodio} launch request. */
        function openInPlayer(acao, id, extra) {
            var parts = [acao + '=' + targetValue(id)];
            for (var k in extra) {
                if (Object.prototype.hasOwnProperty.call(extra, k) && extra[k] != null && extra[k] !== '') {
                    parts.push(k + '=' + targetValue(extra[k]));
                }
            }
            launchApp(PLAYER_ID, 'abrir?' + parts.join('&'));
        }

        function openCard(row, it) {
            if (!it) return;
            if (it.mais) { launchApp(PLAYER_ID); return; }
            if (row.key === 'jogos') {
                if (it.canal && it.canal.id != null) openInPlayer('canal', it.canal.id, { nome: it.canal.nome });
                else launchApp(PLAYER_ID);
            } else if (row.key === 'continuar' && isCanal(it)) {
                openInPlayer('canal', it.id, { nome: it.nome });
            } else if (row.key === 'continuar') {
                var p = it.progresso || {};
                openInPlayer('tocar', it.id, { temporada: p.temporada, episodio: p.episodio });
            } else {
                openInPlayer('titulo', it.id);
            }
        }

        // --- Reordering the dock (started from Customize) ---
        function startShelfEdit() {
            shelfEdit = state.favorites.slice();
            movingTileId = null;
            nav.modo = 'doca';
            nav.app = 0;
            renderAppsShelf();
            render();
        }

        /** Swaps the picked app with its neighbor: in shelfEdit (ids of apps not installed
         * here keep their place), in dockItems and in the DOM (no rebuild, no icon reload). */
        function moveShelfTile(direction) {
            var idx = arrFindIndex(dockItems, function(it) { return it.kind === 'app' && it.app.id === movingTileId; });
            var dest = idx + direction;
            if (idx < 0 || dest < 0 || dest >= dockItems.length || dockItems[dest].kind !== 'app') return;
            var a = dockItems[idx];
            var b = dockItems[dest];
            dockItems[idx] = b;
            dockItems[dest] = a;
            var ia = shelfEdit.indexOf(a.app.id);
            var ib = shelfEdit.indexOf(b.app.id);
            shelfEdit[ia] = b.app.id;
            shelfEdit[ib] = a.app.id;
            var els = trilhoEl.children;
            var elA = els[idx];
            var elB = els[dest];
            if (direction > 0) trilhoEl.insertBefore(elB, elA);
            else trilhoEl.insertBefore(elA, elB);
            nav.app = dest;
            renderDockFocus();
        }

        function finishShelfEdit(save) {
            if (!shelfEdit) return;
            if (save) {
                try { localStorage.setItem('fmtv_favorites', JSON.stringify(shelfEdit)); }
                catch (e) { showToast(t('Could not save the order. Please try again.'), 5000); return; }
                state.favorites = shelfEdit.slice();
            }
            shelfEdit = null;
            movingTileId = null;
            nav.app = 0;
            renderAppsShelf();
            showToast(t(save ? 'Tile order saved' : 'Reordering cancelled'));
        }

        // --- Remote keys on the Home itself ---
        function keyName(e) {
            var c = e.keyCode;
            if (e.key === 'ArrowLeft' || c === 37) return 'left';
            if (e.key === 'ArrowUp' || c === 38) return 'up';
            if (e.key === 'ArrowRight' || c === 39) return 'right';
            if (e.key === 'ArrowDown' || c === 40) return 'down';
            if (e.key === 'Enter' || c === 13) return 'enter';
            if (c === 461 || c === 27 || e.key === 'Escape' || e.key === 'GoBack') return 'back';
            return '';
        }

        function handleMainKey(k) {
            if (nav.modo === 'doca') {
                if (shelfEdit && movingTileId) {
                    if (k === 'left' || k === 'right') moveShelfTile(k === 'left' ? -1 : 1);
                    else if (k === 'back') finishShelfEdit(false);
                    else {
                        movingTileId = null;
                        renderDockFocus();
                        renderHint();
                    }
                    return;
                }
                if (k === 'left' && nav.app > 0) { nav.app--; renderDockFocus(); }
                else if (k === 'right' && nav.app < dockItems.length - 1) { nav.app++; renderDockFocus(); }
                else if (k === 'down' && !shelfEdit) enterShelf();
                else if (k === 'enter') activateDock(nav.app);
                else if (k === 'back' && shelfEdit) finishShelfEdit(false);
                return;
            }
            var row = rows[nav.sec];
            if (!row) { nav.modo = 'doca'; render(); return; }
            if (k === 'left') { if (nav.item > 0) { nav.item--; renderShelf(); } }
            else if (k === 'right') { if (nav.item < row.items.length - 1) { nav.item++; renderShelf(); } }
            else if (k === 'down') { if (nav.sec < rows.length - 1) { nav.sec++; nav.item = 0; renderShelf(); } }
            else if (k === 'up') {
                if (nav.sec > 0) { nav.sec--; nav.item = 0; renderShelf(); }
                else { nav.modo = 'doca'; render(); }
            } else if (k === 'back') { nav.modo = 'doca'; render(); }
            else if (k === 'enter') openCard(row, row.items[nav.item]);
        }

        // --- Modals: focus moves among their .modal-nav items ---
        var modalOpen = false;
        var activeModalCloser = function() {}; // set by whichever modal is currently open
        var modalNavItems = [];
        var modalIndex = 0;

        // Geometric (position-based) focus movement for Up/Down: finds the nearest
        // nav-item strictly above/below the current one, weighted toward the same
        // horizontal column. This replaces hand-tuned index arithmetic that broke
        // every time a row was added/removed (header -> apps -> tabs -> picks).
        // Geometric row jump shared by the main screen and any modal/drawer: picks the
        // nearest item in the requested vertical direction by actual screen position,
        // not by array order, so it works across rows of different lengths (a 4-wide
        // grid next to a single-row of buttons, say) without hardcoding column counts.
        function geometricVerticalMove(items, curIdx, dir) {
            var current = items[curIdx];
            if (!current) return curIdx;
            var cur = current.getBoundingClientRect();
            var curX = cur.left + cur.width / 2;
            var curY = cur.top + cur.height / 2;

            var candidates = [];
            items.forEach(function(el, idx) {
                if (idx === curIdx) return;
                var r = el.getBoundingClientRect();
                var x = r.left + r.width / 2;
                var y = r.top + r.height / 2;
                var dy = (y - curY) * dir;
                // Threshold well above the focus hover-lift (tiles/cards shift up to ~6px on
                // focus via translateY), otherwise that lift alone makes a same-row neighbor
                // look like it's "below" and Down/Up never leaves the row.
                if (dy <= 24) return; // must actually be in the requested direction, a full row away
                candidates.push({ idx: idx, dy: dy, dx: Math.abs(x - curX) });
            });
            if (!candidates.length) return curIdx;

            // Snap to the nearest row first (smallest dy), then pick whichever item in
            // that row is best horizontally aligned. Scoring dy+dx together var a
            // far-but-aligned row (e.g. a full-width picks grid) outscore a narrow row
            // sitting right in between (e.g. the Movies/Shows tabs), which skipped it
            // entirely - rows must win on distance first, alignment only breaks ties.
            var minDy = Math.min.apply(null, candidates.map(function(c) { return c.dy; }));
            var nearestRow = candidates.filter(function(c) { return c.dy <= minDy + 40; });
            nearestRow.sort(function(a, b) { return a.dx - b.dx; });

            return nearestRow[0].idx;
        }

        function moveModalFocusVertical(dir) {
            modalIndex = geometricVerticalMove(modalNavItems, modalIndex, dir);
            setModalFocus(modalNavItems[modalIndex]);
        }

        // --- Customize (dock apps, HDMI devices, preferences) ---
        var settingsModal = document.getElementById('settingsModal');
        var tempFavorites = [];
        var tempDevices = {};

        function openSettingsModal() {
            if (shelfEdit) return;
            modalOpen = true;
            activeModalCloser = closeSettingsModal;
            tempFavorites = state.favorites.slice();
            tempDevices = shallowClone(state.hdmiDevices);
            renderHDMIOptions();
            document.getElementById('cfgClockFormat').value = state.clockFormat;
            document.getElementById('cfgLang').value = state.lang;
            document.getElementById('cfgTextSize').value = state.textSize;

            renderAppSelectorGrid();
            settingsModal.classList.add('active');
            refreshModalNavList(settingsModal);
        }

        function renderHDMIOptions() {
            var container = document.getElementById('hdmiOptions');
            container.innerHTML = '';
            state.catalog.filter(isHDMI).forEach(function(app) {
                var button = document.createElement('button');
                button.className = 'app-toggle-item modal-nav';
                function updateLabel() {
                    button.textContent = app.title + ': ' + (devicePreset(app, tempDevices).title || 'HDMI');
                    button.setAttribute('aria-label', button.textContent + '. Press to change device');
                }
                updateLabel();
                button.addEventListener('click', function() {
                    var current = DEVICE_PRESETS.indexOf(devicePreset(app, tempDevices));
                    tempDevices[app.id] = DEVICE_PRESETS[(current + 1) % DEVICE_PRESETS.length].key;
                    updateLabel();
                    refreshModalNavList();
                    setModalFocus(button);
                });
                container.appendChild(button);
            });
        }

        function closeSettingsModal() {
            modalOpen = false;
            settingsModal.classList.remove('active');
            render();
        }

        // --- All Apps ---
        var allAppsModal = document.getElementById('allAppsModal');

        function renderAllAppsGrid() {
            var container = document.getElementById('allAppsGrid');
            container.innerHTML = '';
            state.catalog.forEach(function(app) {
                var device = devicePreset(app, state.hdmiDevices);
                var title = device.title || app.title;
                var tile = document.createElement('button');
                tile.className = 'all-app-tile modal-nav';
                tile.dataset.id = app.id;
                tile.setAttribute('aria-label', title + (device.title ? ' — ' + app.title : ''));

                var iconDiv = document.createElement('div');
                iconDiv.className = 'app-icon';
                iconDiv.style.background = app.bg || 'linear-gradient(135deg, #0a84ff, #0040a0)';
                if (isHDMI(app)) {
                    iconDiv.style.background = device.color;
                    if (device.logo) {
                        var fallback = document.createElement('span');
                        fallback.className = 'app-art-fallback';
                        fallback.textContent = device.title;
                        iconDiv.appendChild(fallback);
                        addTileImage(iconDiv, 'assets/brands/' + device.logo + '.svg', true);
                    } else {
                        iconDiv.innerHTML = deviceArtwork(device.shape);
                    }
                } else {
                    fillAppIcon(iconDiv, app);
                }
                tile.appendChild(iconDiv);

                var titleSpan = document.createElement('span');
                titleSpan.className = 'all-app-title';
                titleSpan.textContent = title;
                tile.appendChild(titleSpan);

                tile.addEventListener('click', function() {
                    launchApp(app.id);
                    closeAllAppsModal();
                });
                container.appendChild(tile);
            });
            showUpdatingApps();
        }

        function openAllAppsModal() {
            if (shelfEdit) return;
            modalOpen = true;
            activeModalCloser = closeAllAppsModal;
            renderAllAppsGrid();
            allAppsModal.classList.add('active');
            refreshModalNavList(allAppsModal);
            discoverTVApps(true, function() {
                if (!allAppsModal.classList.contains('active')) return;
                renderAllAppsGrid();
                refreshModalNavList(allAppsModal);
            });
        }

        function closeAllAppsModal() {
            modalOpen = false;
            allAppsModal.classList.remove('active');
            // Rebuilt on every open anyway: don't keep a tile and icon per installed app
            // alive in a hidden grid (nor in modalNavItems) between visits.
            document.getElementById('allAppsGrid').innerHTML = '';
            modalNavItems = [];
            render();
        }
        document.getElementById('closeAllAppsBtn').addEventListener('click', closeAllAppsModal);

        // --- Running Apps (Exit key / holding Back) ---
        // As Home, this app replaced LG's own, which used to list background apps on the
        // Exit key. Listing and closing apps (and the Homebrew Channel's exec) are denied to
        // this app on the Luna bus, so both go through a small root helper on the TV
        // (/var/lib/webosbrew/webostv-helper, started at boot, listening on 127.0.0.1 only).
        var runningModal = document.getElementById('runningModal');
        // The Home's own ids: com.webos.app.home (webOS 10) or com.webos.app.fullhome (webOS 4.x)
        var RUNNING_HIDDEN = { 'com.webos.app.home': 1, 'com.webos.app.fullhome': 1, 'org.webos.freemytv': 1 };

        function runningAppIcon(app) {
            var iconDiv = document.createElement('div');
            iconDiv.className = 'app-icon';
            iconDiv.style.background = app.bg || 'linear-gradient(135deg, #0a84ff, #0040a0)';
            fillAppIcon(iconDiv, app);
            return iconDiv;
        }

        // apps: null while loading, 'error', or [{ id, title }] from the helper.
        function renderRunningApps(apps) {
            var grid = document.getElementById('runningGrid');
            var hint = document.getElementById('runningHint');
            grid.innerHTML = '';
            if (apps === null) hint.textContent = t('Loading…');
            else if (apps === 'error') hint.textContent = t('Could not list running apps.');
            else if (!apps.length) hint.textContent = t('No other apps are running.');
            else hint.textContent = t('Select an app to close it.');
            (apps && apps.forEach ? apps : []).forEach(function(running) {
                var id = running.id;
                var app = arrFind(state.catalog, function(c) { return c.id === id; }) || { id: id, title: running.title || id };
                var tile = document.createElement('button');
                tile.className = 'all-app-tile modal-nav';
                tile.dataset.id = id;
                tile.setAttribute('aria-label', app.title);
                tile.appendChild(runningAppIcon(app));
                var titleSpan = document.createElement('span');
                titleSpan.className = 'all-app-title';
                titleSpan.textContent = app.title;
                tile.appendChild(titleSpan);
                tile.addEventListener('click', function() { closeRunningApp(id); });
                grid.appendChild(tile);
            });
            refreshModalNavList(runningModal);
        }

        function listRunningApps() {
            fetch(TV_HELPER + '/running')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    setRunning(data.running); // the dock's open-app dots
                    if (!modalOpen || activeModalCloser !== closeRunningApps) return;
                    renderRunningApps((data.running || []).filter(function(a) {
                        return a.id && !RUNNING_HIDDEN[a.id];
                    }));
                })
                .catch(function() {
                    if (modalOpen && activeModalCloser === closeRunningApps) renderRunningApps('error');
                });
        }

        function closeRunningApp(id, done) {
            var after = function() {
                if (done) { done(); return; }
                listRunningApps();
            };
            fetch(TV_HELPER + '/close?id=' + encodeURIComponent(id)).then(after, after);
        }

        function closeAllRunningApps() {
            var ids = toArray(document.querySelectorAll('#runningGrid .all-app-tile')).map(function(tile) { return tile.dataset.id; });
            var pending = ids.length;
            if (!pending) return;
            ids.forEach(function(id) {
                closeRunningApp(id, function() { if (--pending === 0) listRunningApps(); });
            });
        }

        function openRunningApps() {
            if (shelfEdit || modalOpen) return;
            modalOpen = true;
            activeModalCloser = closeRunningApps;
            renderRunningApps(null);
            runningModal.classList.add('active');
            listRunningApps();
        }

        function closeRunningApps() {
            modalOpen = false;
            runningModal.classList.remove('active');
            render();
        }

        document.getElementById('closeRunningBtn').addEventListener('click', closeRunningApps);
        document.getElementById('closeAllRunningBtn').addEventListener('click', closeAllRunningApps);

        function renderAppSelectorGrid() {
            var container = document.getElementById('appSelectorGrid');
            container.innerHTML = '';

            state.catalog.forEach(function(app) {
                var isSelected = tempFavorites.indexOf(app.id) !== -1;
                var item = document.createElement('div');
                item.className = 'app-toggle-item modal-nav' + (isSelected ? ' selected' : '');
                // Installed app titles come from listLaunchPoints, so they are set as text.
                var titleSpan = document.createElement('span');
                titleSpan.textContent = app.title;
                var markSpan = document.createElement('span');
                markSpan.textContent = isSelected ? '✓' : '+';
                item.appendChild(titleSpan);
                item.appendChild(markSpan);

                item.addEventListener('click', function() {
                    var idx = tempFavorites.indexOf(app.id);
                    if (idx !== -1) {
                        if (tempFavorites.length > 1) tempFavorites.splice(idx, 1);
                    } else {
                        // No cap: the shelf is a horizontal carousel, not a single row.
                        tempFavorites.push(app.id);
                    }
                    renderAppSelectorGrid();
                    refreshModalNavList();
                });
                container.appendChild(item);
            });
        }

        function refreshModalNavList(container) {
            modalNavItems = toArray((container || settingsModal).querySelectorAll('.modal-nav:not(:disabled)'));
            modalIndex = Math.min(modalIndex, modalNavItems.length - 1);
            setModalFocus(modalNavItems[modalIndex]);
        }

        function setModalFocus(el) {
            if (!el) return;
            modalNavItems.forEach(function(i) { i.classList.remove('focused'); });
            el.classList.add('focused');
            el.focus();
            modalIndex = modalNavItems.indexOf(el);
        }

        document.getElementById('closeModalBtn').addEventListener('click', closeSettingsModal);
        document.getElementById('reorderShelfBtn').addEventListener('click', function() {
            closeSettingsModal();
            startShelfEdit();
        });
        document.getElementById('resetDefaultBtn').addEventListener('click', function() {
            tempFavorites = DEFAULT_FAVORITES.slice();
            tempDevices = {};
            renderHDMIOptions();
            document.getElementById('cfgClockFormat').value = '24h';
            document.getElementById('cfgLang').value = 'auto';
            document.getElementById('cfgTextSize').value = 'normal';
            renderAppSelectorGrid();
            refreshModalNavList();
            showToast(t('Defaults restored'));
        });

        document.getElementById('saveModalBtn').addEventListener('click', function() {
            state.favorites = tempFavorites.slice();
            state.hdmiDevices = shallowClone(tempDevices);
            state.clockFormat = document.getElementById('cfgClockFormat').value;
            state.lang = document.getElementById('cfgLang').value;
            state.textSize = document.getElementById('cfgTextSize').value;
            try {
                localStorage.setItem('fmtv_hdmi_devices', JSON.stringify(state.hdmiDevices));
                localStorage.setItem('fmtv_favorites', JSON.stringify(state.favorites));
                localStorage.setItem('fmtv_clock_format', state.clockFormat);
                localStorage.setItem('fmtv_lang', state.lang);
                localStorage.setItem('fmtv_text_size', state.textSize);
            } catch (e) {}

            applyStaticTranslations();
            applyTextSize();
            byId('offlineText').textContent = t('no connection to the homeserver · showing the last copy');
            clockShown = '';
            updateClock();
            renderAppsShelf();
            rowStamp++; // card text is localized when built
            renderLauncherData();
            closeSettingsModal();
            showToast(t('Saved & Applied!'));
        });

        // --- Remote Control Key Handler ---
        document.addEventListener('keydown', function(e) {
            // The minute timer counts monotonic time, which stands still while the TV sleeps:
            // after a wake-up it can be up to a minute late. The wall clock tells.
            if (Date.now() > clockDueAt + 2000) {
                updateClock();
                scheduleClock();
            }

            // Exit key (LG turns a held Back into Exit): Home must never hide on it; show the
            // running apps instead, like LG's own Home did. Exit again closes that list.
            if (e.keyCode === 1001 || e.key === 'Exit') {
                if (modalOpen && activeModalCloser === closeRunningApps) closeRunningApps();
                else openRunningApps();
                e.preventDefault();
                return;
            }

            var k = keyName(e);
            if (modalOpen) {
                if (k === 'back') {
                    activeModalCloser();
                    e.preventDefault();
                } else if (k === 'right' && modalNavItems.length) {
                    modalIndex = (modalIndex + 1) % modalNavItems.length;
                    setModalFocus(modalNavItems[modalIndex]);
                    e.preventDefault();
                } else if (k === 'left' && modalNavItems.length) {
                    modalIndex = (modalIndex - 1 + modalNavItems.length) % modalNavItems.length;
                    setModalFocus(modalNavItems[modalIndex]);
                    e.preventDefault();
                } else if (k === 'down') {
                    moveModalFocusVertical(1);
                    e.preventDefault();
                } else if (k === 'up') {
                    moveModalFocusVertical(-1);
                    e.preventDefault();
                } else if (k === 'enter') {
                    var active = modalNavItems[modalIndex];
                    if (active && active.tagName !== 'INPUT' && active.tagName !== 'SELECT') {
                        active.click();
                        e.preventDefault();
                    }
                }
                return;
            }

            if (!k) return;
            e.preventDefault();
            handleMainKey(k);
        });

        // --- Hidden behind another app ---
        // This page never closes: as Home it waits behind every app the user opens, for days.
        // While hidden: no clock ticks, no homeserver polling, installs polled once a minute,
        // and the content row (with its decoded images) dropped.
        var pageShownAt = 0;

        function onPageHidden() {
            clearTimeout(clockTimer);
            clockTimer = null;
            clearInterval(launcherTimer);
            launcherTimer = null;
            clearTimeout(updatePollTimer);
            updatePollTimer = setTimeout(pollUpdatingApps, 60000);
            if (nav.modo === 'prat') {
                nav.modo = 'doca';
                render();
            }
            clearFaixa();
        }

        function onPageShown() {
            // visibilitychange and webOSRelaunch usually both report the same return to Home.
            if (Date.now() - pageShownAt < 1000) return;
            pageShownAt = Date.now();
            updateClock();
            scheduleClock();
            pollUpdatingApps();
            discoverTVApps(true);
            refreshRunning();
            refreshLauncher();
            startLauncherTimer();
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) onPageHidden();
            else onPageShown();
        });

        // --- Relaunch while running (Home key, Back out of another app) ---
        // Running as com.webos.app.home with handlesRelaunch: true, a launch while this app
        // is already running (hidden behind another app) only fires webOSRelaunch: webOS
        // won't raise the window itself, so without this the screen stayed on the other
        // app or went black. Bring it to the front and land on the first app of the dock.
        function reopenedAsHome() {
            if (window.webOSSystem && typeof window.webOSSystem.activate === 'function') window.webOSSystem.activate();
            else if (window.PalmSystem && typeof window.PalmSystem.activate === 'function') window.PalmSystem.activate();
            // Also when no visibilitychange came (or comes later): refreshes the homeserver
            // data, the running apps and the installs.
            onPageShown();
            if (shelfEdit) finishShelfEdit(false);
            if (modalOpen) activeModalCloser();
            nav.modo = 'doca';
            nav.app = 0;
            render();
        }
        document.addEventListener('webOSRelaunch', reopenedAsHome);

        // --- Boot Sequence ---
        document.getElementById('appVersion').textContent = 'WebOS TV v' + APP_VERSION;
        byId('offlineText').textContent = t('no connection to the homeserver · showing the last copy');
        applyStaticTranslations();
        applyTextSize();
        loadCachedLauncher();      // the last copy first: the screen is complete at once
        rows = buildRows();
        updateClock();
        scheduleClock();
        renderAppsShelf();
        renderLauncherData();
        render();
        refreshLauncher();
        startLauncherTimer();
        discoverTVApps();
        setTimeout(function() { discoverTVApps(true); }, 20000);
        setTimeout(function() { discoverTVApps(true); }, 90000);
        pollUpdatingApps();
        refreshRunning();
    </script>
</body>
</html>
